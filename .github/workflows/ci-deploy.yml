name: Verify and deploy Ad Client Manager

on:
  push:
    branches: [main]
  # Manual verification is safe from any branch. Publication also requires
  # selecting main and explicitly confirming the release below.
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Approve publishing verified main to deploy (only after all release gates)'
        required: true
        type: choice
        options:
          - 'NO'
          - 'YES'
        default: 'NO'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ad-client-manager-release
  cancel-in-progress: false

jobs:
  verify:
    name: PHP, MySQL, security and HTTP smoke tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: adclients_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enforce release trigger and file promotion policy
        run: python3 tests/release_policy.py

      - name: Check PHP version
        run: |
          php -v
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION < 3) { fwrite(STDERR, "PHP 8.3+ required\n"); exit(1); }'

      - name: Check PHP syntax and private file rules
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n 1 php -l
          test -f index.php
          test -f .htaccess
          test -f app/core.php
          test -f app/.htaccess
          grep -q 'Require all denied' app/.htaccess
          grep -q 'DirectoryIndex index.php' .htaccess
          test ! -f .env
          test ! -f adclients-config.php

      - name: Test recurrence and demo filter without database
        run: php tests/smoke.php

      - name: Test session lifetime and revocation boundaries
        run: php tests/auth_regression.php

      - name: Test private PDF validation and storage boundaries
        run: php tests/document_smoke.php

      - name: Test MySQL migrations and demo finance exclusion
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: adclients_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-only-root
        run: |
          if ! php -m | grep -qi '^pdo_mysql$'; then
            sudo apt-get update -qq
            sudo apt-get install -y php8.3-mysql
          fi
          php tests/mysql_integration.php
          php tests/workflow_integration.php
          php tests/reminders_integration.php
          php tests/finance_integration.php
          php tests/export_integration.php
          php tests/import_integration.php
          php tests/audit_integration.php

      - name: Check bootstrap form behavior (when available)
        run: |
          if test -f tests/bootstrap_form.php; then php tests/bootstrap_form.php; fi

      - name: HTTP smoke test (all unconfigured modes stay locked)
        run: |
          php -S 127.0.0.1:8083 -t . >/tmp/adclients-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/adclients-response.html -w '%{http_code}' http://127.0.0.1:8083/ || true)
            if [ "$code" = "503" ]; then break; fi
            sleep 1
          done
          test "$code" = "503"
          grep -Eq 'Ведутся технические работы|Конфигурация базы данных ещё не установлена' /tmp/adclients-response.html


      - name: Full authenticated HTTP and PDF upload/download E2E (disposable MySQL)
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: adclients_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-only-root
          ADC_HTTP_TEST_FIXTURE: isolated-github-actions
          ADC_PREFLIGHT_TEST_FIXTURE: isolated-github-actions
        run: |
          php tests/http_fixture.php init
          php -r 'require "app/core.php"; require "app/documents.php"; adc_doc_ensure_directory();'
          php scripts/release_preflight.php --verify-pdfs
          php -S 127.0.0.1:8085 -t . >/tmp/adclients-http-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; php tests/http_fixture.php cleanup' EXIT
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          test "$code" = "200"
          python3 tests/http_e2e.py || { tail -n 75 /tmp/adclients-http-e2e.log; exit 1; }
          python3 tests/http_auth_e2e.py || { tail -n 75 /tmp/adclients-http-e2e.log; exit 1; }
          # An active, valid private PDF must pass preflight; corruption must
          # cause a hard failure even when database connectivity is healthy.
          php tests/preflight_fixture.php seed
          php scripts/release_preflight.php --verify-pdfs
          php tests/preflight_fixture.php corrupt
          if php scripts/release_preflight.php --verify-pdfs; then
            echo "Preflight incorrectly accepted a damaged private PDF" >&2
            exit 1
          fi
          php tests/preflight_fixture.php cleanup
          php scripts/release_preflight.php --verify-pdfs


      - name: Verify backup/restore of SQL and private PDFs in a second database
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: adclients_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-only-root
          ADC_RESTORE_TEST_FIXTURE: isolated-github-actions
          MYSQL_PWD: ci-only-root
        run: |
          set -euo pipefail
          if ! command -v mysqldump >/dev/null || ! command -v mysql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y default-mysql-client
          fi
          tempdir=$(mktemp -d)
          trap 'php tests/restore_fixture.php cleanup; rm -rf "$tempdir"' EXIT
          php tests/restore_fixture.php seed
          private_dir=$(php -r 'require "app/core.php"; require "app/documents.php"; echo adc_doc_directory();')
          test -d "$private_dir"
          test ! -d "$tempdir/restored-pdfs"
          mysqldump -h 127.0.0.1 -u root --single-transaction --no-tablespaces adclients_test > "$tempdir/backup.sql"
          mkdir "$tempdir/backup-pdfs" "$tempdir/restored-pdfs"
          cp -p "$private_dir"/*.pdf "$tempdir/backup-pdfs/"
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE adclients_restore_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h 127.0.0.1 -u root adclients_restore_test < "$tempdir/backup.sql"
          cp -p "$tempdir/backup-pdfs/"*.pdf "$tempdir/restored-pdfs/"
          TEST_DB_NAME=adclients_restore_test ADC_RESTORE_PDF_DIR="$tempdir/restored-pdfs" php tests/restore_fixture.php verify

  deploy:
    name: Manual release of verified application files only
    needs: verify
    # IMPORTANT: main push/PR/manual runs without YES MUST NOT promote files.
    # The deploy branch is only updated by an explicit manual confirmation
    # from main, after the operator has passed docs/RELEASE.md release gates.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_release == 'YES'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source and deployment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote tested files to Hostinger branch
        run: |
          git fetch origin main deploy
          git switch --detach origin/deploy
          git restore --source=origin/main --staged --worktree -- index.php .htaccess app
          if git diff --cached --quiet; then
            echo "No deployment changes needed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "deploy: verified application release"
          git push origin HEAD:deploy
